<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 470" width="850" height="470" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Wiring diagram: chair pad to XIAO ESP32S3</title>
  <desc id="d">The chair pad contains two conductors, each looped out and back on two wires. Red and black are the two ends of conductor A; green and yellow are the two ends of conductor B. A pressure switch between the conductors closes under weight. Red connects through a 1 kilohm resistor to pin D3. Green connects to GND. Yellow connects to pin D4 as a cable check. Black is unused and insulated. The board is powered by USB-C and needs its FPC antenna attached.</desc>

  <rect width="850" height="470" fill="#ffffff"/>
  <text x="425" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Wiring: chair pad to XIAO ESP32S3 (schematic)</text>

  <!-- Pad -->
  <rect x="30" y="60" width="250" height="300" rx="10" fill="#f3f1ea" stroke="#333" stroke-width="2"/>
  <text x="155" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Chair pad</text>

  <!-- Conductor A loop (red/black ends) -->
  <path d="M280 110 H90 V180 H280" fill="none" stroke="#555" stroke-width="4"/>
  <text x="100" y="102" font-size="13" fill="#333">conductor A</text>
  <!-- Conductor B loop (green/yellow ends) -->
  <path d="M280 240 H90 V310 H280" fill="none" stroke="#555" stroke-width="4"/>
  <text x="100" y="332" font-size="13" fill="#333">conductor B</text>

  <!-- Pressure switch between the conductors -->
  <line x1="120" y1="180" x2="120" y2="198" stroke="#111" stroke-width="3"/>
  <circle cx="120" cy="201" r="4" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="120" cy="221" r="4" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="120" y1="221" x2="136" y2="203" stroke="#111" stroke-width="3"/>
  <line x1="120" y1="224" x2="120" y2="240" stroke="#111" stroke-width="3"/>
  <text x="144" y="206" font-size="13" fill="#111">pressure switch:</text>
  <text x="144" y="222" font-size="13" fill="#111">closes under weight</text>

  <!-- Wire helper: dark outline under each colored wire for contrast -->
  <!-- Red: pad -> 1k -> D3 -->
  <path d="M280 110 H400 M460 110 H520 V150 H560" fill="none" stroke="#222" stroke-width="7"/>
  <path d="M280 110 H400 M460 110 H520 V150 H560" fill="none" stroke="#d32f2f" stroke-width="4"/>
  <rect x="400" y="100" width="60" height="20" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="430" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">1 kΩ</text>
  <text x="300" y="102" font-size="13" font-weight="bold" fill="#b71c1c">red</text>

  <!-- Black: unused, insulated -->
  <path d="M280 180 H372" fill="none" stroke="#222" stroke-width="7"/>
  <path d="M280 180 H372" fill="none" stroke="#111" stroke-width="4"/>
  <rect x="372" y="172" width="20" height="16" rx="3" fill="#9e9e9e" stroke="#111" stroke-width="1.5"/>
  <text x="300" y="172" font-size="13" font-weight="bold" fill="#111">black</text>
  <text x="400" y="185" font-size="13" fill="#111">unused: insulate</text>

  <!-- Green: pad -> GND -->
  <path d="M280 240 H560" fill="none" stroke="#222" stroke-width="7"/>
  <path d="M280 240 H560" fill="none" stroke="#2e7d32" stroke-width="4"/>
  <text x="300" y="232" font-size="13" font-weight="bold" fill="#1b5e20">green</text>

  <!-- Yellow: pad -> D4 -->
  <path d="M280 310 H560" fill="none" stroke="#222" stroke-width="7"/>
  <path d="M280 310 H560" fill="none" stroke="#fbc02d" stroke-width="4"/>
  <text x="300" y="302" font-size="13" font-weight="bold" fill="#111">yellow</text>

  <!-- Board -->
  <rect x="560" y="90" width="200" height="260" rx="8" fill="#e8eef7" stroke="#333" stroke-width="2"/>
  <text x="660" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Seeed XIAO</text>
  <text x="660" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">ESP32S3</text>
  <circle cx="560" cy="150" r="5" fill="#111"/>
  <text x="572" y="155" font-size="14" font-weight="bold" fill="#111">D3 (GPIO4)</text>
  <text x="572" y="172" font-size="12" fill="#333">switch input</text>
  <circle cx="560" cy="240" r="5" fill="#111"/>
  <text x="572" y="245" font-size="14" font-weight="bold" fill="#111">GND</text>
  <circle cx="560" cy="310" r="5" fill="#111"/>
  <text x="572" y="315" font-size="14" font-weight="bold" fill="#111">D4 (GPIO5)</text>
  <text x="572" y="332" font-size="12" fill="#333">cable check</text>
  <text x="660" y="205" text-anchor="middle" font-size="12" fill="#333">internal pull-ups,</text>
  <text x="660" y="220" text-anchor="middle" font-size="12" fill="#333">no extra parts</text>

  <!-- Power and antenna -->
  <path d="M760 200 H790" stroke="#111" stroke-width="3"/>
  <text x="796" y="197" font-size="12" fill="#111">USB-C</text>
  <text x="796" y="212" font-size="12" fill="#111">5 V</text>
  <rect x="610" y="58" width="100" height="18" rx="2" fill="#c9a36a" stroke="#111" stroke-width="1.5"/>
  <line x1="660" y1="76" x2="660" y2="90" stroke="#111" stroke-width="2"/>
  <text x="660" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">FPC antenna (required)</text>

  <!-- Notes -->
  <text x="30" y="395" font-size="13" fill="#111">Red and black are the two ends of one conductor; green and yellow are the two ends of the other.</text>
  <text x="30" y="414" font-size="13" fill="#111">Never wire both ends of one conductor to the board: that ties D3 to GND and reads "occupied" forever.</text>
  <text x="30" y="433" font-size="13" fill="#111">Colors are from the tested pad. Confirm yours with docs/identify-your-pad.md.</text>
  <text x="30" y="452" font-size="13" fill="#111">Schematic only: on the board, GND is on the opposite edge from D3 and D4. Check the silkscreen.</text>
</svg>
