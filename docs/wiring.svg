<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 610" width="860" height="610" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Wiring diagram: chair pad to XIAO ESP32S3</title>
  <desc id="d">The chair pad contains two conductors, each looped out and back on two wires. Red and black are the two ends of conductor A; green and yellow are the two ends of conductor B. A pressure switch between the conductors closes under weight. The board is drawn component side up with the USB-C port at the bottom. Its right edge has pins D6 at the top down to D0 at the bottom; its left edge has D7, D8, D9, D10, 3V3, GND and 5V from top to bottom. Red runs over the top of the board through a 1 kilohm resistor to pin D3, the fourth pin from the bottom on the right edge. Yellow runs over the top through a second 1 kilohm resistor to pin D4, just above D3. Green connects to GND, second from the bottom on the left edge. Black is unused and insulated. The FPC antenna must be attached to the board's U.FL socket.</desc>

  <rect width="860" height="610" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Wiring: chair pad to XIAO ESP32S3</text>

  <!-- Pad -->
  <rect x="30" y="110" width="270" height="320" rx="10" fill="#f3f1ea" stroke="#333" stroke-width="2"/>
  <text x="165" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Chair pad</text>

  <!-- Conductor A: outer loop, ends red (top) and black (bottom) -->
  <path d="M300 140 H70 V410 H300" fill="none" stroke="#555" stroke-width="4"/>
  <text x="80" y="160" font-size="13" fill="#333">conductor A</text>
  <!-- Conductor B: inner loop, ends yellow (top) and green (bottom) -->
  <path d="M300 200 H150 V330 H300" fill="none" stroke="#555" stroke-width="4"/>
  <text x="160" y="222" font-size="13" fill="#333">conductor B</text>

  <!-- Pressure switch between the two conductors -->
  <line x1="70" y1="265" x2="87" y2="265" stroke="#111" stroke-width="3"/>
  <circle cx="91" cy="265" r="4" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="111" cy="265" r="4" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="91" y1="265" x2="108" y2="251" stroke="#111" stroke-width="3"/>
  <line x1="115" y1="265" x2="150" y2="265" stroke="#111" stroke-width="3"/>
  <text x="160" y="260" font-size="13" fill="#111">pressure switch:</text>
  <text x="160" y="277" font-size="13" fill="#111">closes under weight</text>

  <!-- Each wire: dark outline underneath for contrast, then its color -->
  <!-- Red: over the top, through 1k, down the right side to D3 -->
  <path d="M300 140 H340 V80 H520 M580 80 H770 V310 H670" fill="none" stroke="#222" stroke-width="7" stroke-linejoin="round"/>
  <path d="M300 140 H340 V80 H520 M580 80 H770 V310 H670" fill="none" stroke="#d32f2f" stroke-width="4" stroke-linejoin="round"/>
  <rect x="520" y="70" width="60" height="20" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="550" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">1 kΩ</text>
  <text x="306" y="132" font-size="13" font-weight="bold" fill="#b71c1c">red</text>

  <!-- Yellow: over the top, through 1k, down to D4 -->
  <path d="M300 200 H370 V115 H520 M580 115 H730 V270 H670" fill="none" stroke="#222" stroke-width="7" stroke-linejoin="round"/>
  <path d="M300 200 H370 V115 H520 M580 115 H730 V270 H670" fill="none" stroke="#fbc02d" stroke-width="4" stroke-linejoin="round"/>
  <rect x="520" y="105" width="60" height="20" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="550" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">1 kΩ</text>
  <text x="306" y="192" font-size="13" font-weight="bold" fill="#111">yellow</text>

  <!-- Green: to GND, second from the bottom on the left edge -->
  <path d="M300 330 H400 V390 H450" fill="none" stroke="#222" stroke-width="7" stroke-linejoin="round"/>
  <path d="M300 330 H400 V390 H450" fill="none" stroke="#2e7d32" stroke-width="4" stroke-linejoin="round"/>
  <text x="306" y="322" font-size="13" font-weight="bold" fill="#1b5e20">green</text>

  <!-- Black: unused, insulated -->
  <path d="M300 410 H330" fill="none" stroke="#222" stroke-width="7"/>
  <path d="M300 410 H330" fill="none" stroke="#111" stroke-width="4"/>
  <rect x="330" y="402" width="20" height="16" rx="3" fill="#9e9e9e" stroke="#111" stroke-width="1.5"/>
  <text x="306" y="400" font-size="13" font-weight="bold" fill="#111">black</text>
  <text x="340" y="440" font-size="13" fill="#111">unused: insulate</text>

  <!-- Board: component side up, USB-C at the bottom -->
  <rect x="450" y="150" width="220" height="320" rx="8" fill="#e8eef7" stroke="#333" stroke-width="2"/>
  <text x="560" y="206" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Seeed XIAO</text>
  <text x="560" y="224" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">ESP32S3</text>
  <text x="560" y="340" text-anchor="middle" font-size="12" fill="#333">component side up</text>
  <text x="560" y="356" text-anchor="middle" font-size="12" fill="#333">internal pull-ups</text>

  <!-- Left edge pins, top to bottom: D7 D8 D9 D10 3V3 GND 5V -->
  <g font-size="12" fill="#888">
    <circle cx="450" cy="190" r="4" fill="#fff" stroke="#999" stroke-width="1.5"/><text x="460" y="194">D7</text>
    <circle cx="450" cy="230" r="4" fill="#fff" stroke="#999" stroke-width="1.5"/><text x="460" y="234">D8</text>
    <circle cx="450" cy="270" r="4" fill="#fff" stroke="#999" stroke-width="1.5"/><text x="460" y="274">D9</text>
    <circle cx="450" cy="310" r="4" fill="#fff" stroke="#999" stroke-width="1.5"/><text x="460" y="314">D10</text>
    <circle cx="450" cy="350" r="4" fill="#fff" stroke="#999" stroke-width="1.5"/><text x="460" y="354">3V3</text>
    <circle cx="450" cy="430" r="4" fill="#fff" stroke="#999" stroke-width="1.5"/><text x="460" y="434">5V</text>
  </g>
  <circle cx="450" cy="390" r="5.5" fill="#111"/>
  <text x="461" y="395" font-size="14" font-weight="bold" fill="#111">GND</text>

  <!-- Right edge pins, top to bottom: D6 D5 D4 D3 D2 D1 D0 -->
  <g font-size="12" fill="#888" text-anchor="end">
    <circle cx="670" cy="190" r="4" fill="#fff" stroke="#999" stroke-width="1.5"/><text x="660" y="194">D6</text>
    <circle cx="670" cy="230" r="4" fill="#fff" stroke="#999" stroke-width="1.5"/><text x="660" y="234">D5</text>
    <circle cx="670" cy="350" r="4" fill="#fff" stroke="#999" stroke-width="1.5"/><text x="660" y="354">D2</text>
    <circle cx="670" cy="390" r="4" fill="#fff" stroke="#999" stroke-width="1.5"/><text x="660" y="394">D1</text>
    <circle cx="670" cy="430" r="4" fill="#fff" stroke="#999" stroke-width="1.5"/><text x="660" y="434">D0</text>
  </g>
  <circle cx="670" cy="270" r="5.5" fill="#111"/>
  <text x="659" y="275" text-anchor="end" font-size="14" font-weight="bold" fill="#111">D4 (GPIO5)</text>
  <circle cx="670" cy="310" r="5.5" fill="#111"/>
  <text x="659" y="315" text-anchor="end" font-size="14" font-weight="bold" fill="#111">D3 (GPIO4)</text>

  <!-- Wire roles, right of the wires -->
  <text x="782" y="274" font-size="12" fill="#333">D4: cable</text>
  <text x="782" y="288" font-size="12" fill="#333">check</text>
  <text x="782" y="314" font-size="12" fill="#333">D3: switch</text>
  <text x="782" y="328" font-size="12" fill="#333">input</text>

  <!-- USB-C at the bottom -->
  <rect x="530" y="462" width="60" height="20" rx="4" fill="#bdbdbd" stroke="#111" stroke-width="1.5"/>
  <text x="560" y="500" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">USB-C, 5 V</text>

  <!-- Notes -->
  <text x="30" y="532" font-size="13" fill="#111">Red and black are the two ends of one conductor; green and yellow are the two ends of the other.</text>
  <text x="30" y="551" font-size="13" fill="#111">Never wire both ends of one conductor to the board: that ties D3 to GND and reads "occupied" forever.</text>
  <text x="30" y="570" font-size="13" fill="#111">Board shown component side up, USB-C at the bottom. Confirm pin labels on your board's silkscreen.</text>
  <text x="30" y="589" font-size="13" fill="#111">Clip the FPC antenna onto the U.FL socket (required). Colors are from the tested pad: see docs/identify-your-pad.md.</text>
</svg>
